[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sponsorscout"
version = "0.1.1"
description = "Verified sponsorship-focused job discovery for international candidates"
requires-python = ">=3.10"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.31.0,<3.0.0",
    "playwright>=1.40.0,<2.0.0",
    "PySide6>=6.5.0",
]

# Dev/test-only dependencies (pytest, pyinstaller) are intentionally NOT listed
# here so an editable install for the app stays lean. Install them with:
#   pip install ".[dev]"
# Removed from this package's runtime deps (verified unused by the shipped app):
#   beautifulsoup4, lxml, Pillow, pandas — legacy `extra_for_dev_purpose` only.

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pyinstaller>=6.0.0",
]

# Test suite lives in sponsorscout/tests and runs with pytest:
#   pip install ".[dev]"  then  python -m pytest sponsorscout/tests

[project.urls]
Homepage = "https://sponsorscout.app"
Repository = "https://github.com/Kazake95/SponsorScout"
Issues = "https://github.com/Kazake95/SponsorScout/issues"

[project.scripts]
sponsorscout = "sponsorscout.main:main"
sponsorscout-scan = "sponsorscout.scripts.run_scan:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["sponsorscout*"]

[tool.setuptools.package-data]
sponsorscout = ["data/*.json", "data/seeds/*.csv", "data/*.png", "data/*.ico", "data/icons/*.png", "db/*.sql"]